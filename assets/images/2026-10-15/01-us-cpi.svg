<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="米国CPIと株安の流れ">
<rect width="800" height="360" fill="#f4f6fa"/>
<rect x="30" y="30" width="740" height="300" rx="16" fill="#fff" stroke="#c9d1e0" stroke-width="2"/>
<text x="400" y="90" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2d4d">物価高が株安につながる流れ</text>
<g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#1f2d4d">
<rect x="70" y="140" width="200" height="110" rx="12" fill="利下げ期待"/><text x="170" y="190">原油高</text><text x="170" y="222">物価上昇3.7%</text>
<rect x="300" y="140" width="200" height="110" rx="12" fill="利下げ期待"/><text x="400" y="190">が後退</text><text x="400" y="222">株価下落</text>
<rect x="530" y="140" width="200" height="110" rx="12" fill="利下げ期待"/><text x="630" y="190">ハイテク株中心</text><text x="630" y="222">#dce8fb</text>
</g>
