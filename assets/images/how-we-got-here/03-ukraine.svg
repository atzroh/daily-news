<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">War and Energy</title>
<desc id="desc">ロシアがウクライナへ侵攻：人命・住まい・生活基盤に被害．次に，欧州が制裁と調達変更：天然ガスの取引にも混乱．次に，日本の燃料調達にも波及：電気代や生産費に影響する場合．背景を理解するための模式図です．</desc>
<rect width="640" height="480" rx="20" fill="#f4f1e9"/>
<g font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
<text x="32" y="38" font-size="17" font-weight="700" letter-spacing="2" fill="#316c72">WORLD / 03</text>
<text x="32" y="69" font-size="26" font-weight="700" fill="#172b3b">War and Energy</text>
<rect x="32" y="90" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
<text x="320" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#172b3b">ロシアがウクライナへ侵攻</text>
<text x="320" y="159" text-anchor="middle" font-size="22" fill="#536675">人命・住まい・生活基盤に被害</text>
<path d="M320 189v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="209" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
<text x="320" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#172b3b">欧州が制裁と調達変更</text>
<text x="320" y="278" text-anchor="middle" font-size="22" fill="#536675">天然ガスの取引にも混乱</text>
<path d="M320 308v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="328" width="576" height="94" rx="12" fill="#173f4b" stroke="#173f4b"/>
<text x="320" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">日本の燃料調達にも波及</text>
<text x="320" y="397" text-anchor="middle" font-size="22" fill="#d8ebe8">電気代や生産費に影響する場合</text>
<text x="32" y="456" font-size="17" fill="#536675">説明用の模式図 / ATZROH DAILY</text>
</g>
</svg>
