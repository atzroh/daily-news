<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">Climate and Daily Life</title>
<desc id="desc">温室効果ガスによる温暖化：暑さや災害が生活・生産に影響．次に，排出削減と被害への備え：省エネ・発電・防災へ投資．次に，費用と効果を見極める：電気代・食料・働き方に関わる．背景を理解するための模式図です．</desc>
