<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">Wages and Prices</title>
<desc id="desc">長い物価と賃金の停滞：企業も家計も支出に慎重．次に，輸入価格上昇と人手不足：販売価格と給料を見直す動き．次に，金融政策も転換：賃上げが物価に追いつくかが鍵．背景を理解するための模式図です．</desc>
<rect width="640" height="480" rx="20" fill="#f4f1e9"/>
<g font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
<text x="32" y="38" font-size="17" font-weight="700" letter-spacing="2" fill="#316c72">JAPAN / 06</text>
<text x="32" y="69" font-size="26" font-weight="700" fill="#172b3b">Wages and Prices</text>
<rect x="32" y="90" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
<text x="320" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#172b3b">長い物価と賃金の停滞</text>
<text x="320" y="159" text-anchor="middle" font-size="22" fill="#536675">企業も家計も支出に慎重</text>
<path d="M320 189v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="209" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
<text x="320" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#172b3b">輸入価格上昇と人手不足</text>
<text x="320" y="278" text-anchor="middle" font-size="22" fill="#536675">販売価格と給料を見直す動き</text>
<path d="M320 308v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="328" width="576" height="94" rx="12" fill="#173f4b" stroke="#173f4b"/>
<text x="320" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">金融政策も転換</text>
<text x="320" y="397" text-anchor="middle" font-size="22" fill="#d8ebe8">賃上げが物価に追いつくかが鍵</text>
<text x="32" y="456" font-size="17" fill="#536675">説明用の模式図 / ATZROH DAILY</text>
</g>
</svg>
