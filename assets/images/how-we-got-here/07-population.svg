<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">People and Services</title>
<desc id="desc">人口減少と年齢構成の変化：子どもが減り高齢化が進む．次に，担い手と支え方を見直す：子育て・医療・介護・交通．次に，働き方と負担の分担が課題：支援の効果には時間もかかる．背景を理解するための模式図です．</desc>
<rect width="640" height="480" rx="20" fill="#f4f1e9"/>
<g font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
<text x="32" y="38" font-size="17" font-weight="700" letter-spacing="2" fill="#316c72">JAPAN / 07</text>
<text x="32" y="69" font-size="26" font-weight="700" fill="#172b3b">People and Services</text>
<rect x="32" y="90" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
