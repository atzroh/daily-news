<text x="320" y="159" text-anchor="middle" font-size="22" fill="#536675">子どもが減り高齢化が進む</text>
<path d="M320 189v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="209" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
<text x="320" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#172b3b">担い手と支え方を見直す</text>
<text x="320" y="278" text-anchor="middle" font-size="22" fill="#536675">子育て・医療・介護・交通</text>
<path d="M320 308v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="328" width="576" height="94" rx="12" fill="#173f4b" stroke="#173f4b"/>
<text x="320" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">働き方と負担の分担が課題</text>
<text x="320" y="397" text-anchor="middle" font-size="22" fill="#d8ebe8">支援の効果には時間もかかる</text>
