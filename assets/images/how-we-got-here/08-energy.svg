<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">Power and Safety</title>
<desc id="desc">震災と原発事故：安全・復興・廃炉が長期の課題．次に，燃料価格と電力需要の変化：省エネと電源の確保を進める．次に，安全・価格・安定供給の両立：電気代と地域の暮らしに関わる．背景を理解するための模式図です．</desc>
<rect width="640" height="480" rx="20" fill="#f4f1e9"/>
<g font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
<text x="32" y="38" font-size="17" font-weight="700" letter-spacing="2" fill="#316c72">JAPAN / 08</text>
<text x="32" y="69" font-size="26" font-weight="700" fill="#172b3b">Power and Safety</text>
<rect x="32" y="90" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
<text x="320" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#172b3b">震災と原発事故</text>
<text x="320" y="159" text-anchor="middle" font-size="22" fill="#536675">安全・復興・廃炉が長期の課題</text>
<path d="M320 189v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="209" width="576" height="94" rx="12" fill="#ffffff" stroke="#ddd8ca"/>
<text x="320" y="245" text-anchor="middle" font-size="26" font-weight="700" fill="#172b3b">燃料価格と電力需要の変化</text>
<text x="320" y="278" text-anchor="middle" font-size="22" fill="#536675">省エネと電源の確保を進める</text>
<path d="M320 308v11m-6-5 6 6 6-6" fill="none" stroke="#6d878b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="328" width="576" height="94" rx="12" fill="#173f4b" stroke="#173f4b"/>
<text x="320" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">安全・価格・安定供給の両立</text>
<text x="320" y="397" text-anchor="middle" font-size="22" fill="#d8ebe8">電気代と地域の暮らしに関わる</text>
<text x="32" y="456" font-size="17" fill="#536675">説明用の模式図 / ATZROH DAILY</text>
</g>
